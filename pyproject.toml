[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zotlocal"
version = "0.3.0"
description = "Read-only CLI for Zotero Desktop's local API. No Web API key. No cloud."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hc-ui" }]
keywords = ["zotero", "bibtex", "citations", "cli", "local"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zotlocal = "zotlocal.cli:main"

[project.urls]
Homepage = "https://github.com/hc-ui/zotlocal"
Issues = "https://github.com/hc-ui/zotlocal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zotlocal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
